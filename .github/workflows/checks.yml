name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --prefix nextjs-app
      - run: npm run build --prefix nextjs-app
      - run: npm run typecheck --prefix nextjs-app
      - run: npm test --prefix nextjs-app
      - run: docker build -t lan-telemetry-sandbox:local sandbox
      - run: python scripts/smoke.py
